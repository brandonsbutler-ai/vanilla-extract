[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vanilla-extract"
version = "0.2.0"
description = "Extract text and fields from documents using only the Python standard library"
readme = "README.md"
license = { file = "LICENSE" }
# 3.11, not 3.9: nothing here was ever run below 3.11, and the project's
# own checkers cannot run there -- verify_e2e.py, packaging/verify_dist.py
# and one unit test import tomllib, which arrived in 3.11. Raised
# 2026-09-22 rather than ship a compatibility claim nobody has tested.
requires-python = ">=3.11"
authors = [{ name = "Brandon S. Butler" }]
keywords = ["pdf", "docx", "text-extraction", "ocr-free", "no-dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # The series CI actually runs (.github/workflows/ci.yml): 3.11, 3.13,
    # 3.14. 3.12 sits between two tested series and is listed with them.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]

# RUNTIME DEPENDENCIES: none, deliberately, and this list must stay empty.
# The build and packaging tools below are development-only; they never ship
# inside the application and they are not needed to run it from source.
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
# The LIBRARY has no dependencies. The desktop window has one, and it lives
# here so that installing the package stays dependency-free and the [gui]
# extra -- `pip install "vanilla-extract[gui]"`, or `pip install ".[gui]"`
# from a clone -- adds the toolkit for the window.
# PySide6-Essentials caps the interpreter as well as naming a floor: every
# release this range allows declares python_requires <3.14 or <3.15, and
# the newest (6.11.x) declares >=3.10,<3.15 (read from PyPI 2026-09-22).
# So the extra installs cleanly across 3.11-3.14 and will need a newer
# Qt before 3.15. It does not push this package's floor above 3.11.
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
vanilla = "vanilla_extract.__main__:main"
vanilla-gui = "vanilla_extract.gui.qt_app:main"

[project.urls]
Homepage = "https://github.com/brandonsbutler-ai/vanilla-extract"

[tool.setuptools]
packages = ["vanilla_extract", "vanilla_extract.formats", "vanilla_extract.gui"]
